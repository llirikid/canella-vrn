<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canella VRN — Панель управления</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#F8F3ED">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{deep:'#3B0A17',wine:'#4D1121',gold:'#C9A24B',cream:'#FBF7F4',ink:'#1E1416',muted:'#7A6B6E'},fontFamily:{sans:['Manrope','sans-serif'],display:['Unbounded','sans-serif']}}}}
</script>
<style>
body{background:#FBF7F4;color:#1E1416;font-weight:500}
.hide{display:none!important}
.f{width:100%;padding:.65rem .85rem;background:#fff;border:1.5px solid #E7DDD8;border-radius:.75rem;font-weight:600;outline:none;transition:border-color .15s}
.f:focus{border-color:#3B0A17}
.lbl{display:block;font-size:.75rem;font-weight:700;color:#7A6B6E;margin-bottom:.35rem}
.btn{background:#3B0A17;color:#fff;font-weight:700;padding:.65rem 1.1rem;border-radius:.75rem;transition:background .15s}
.btn:hover{background:#5E1829}
.btn2{background:#fff;border:1.5px solid #E7DDD8;font-weight:700;padding:.6rem 1rem;border-radius:.75rem}
.btn2:hover{border-color:#3B0A17}
.card{background:#fff;border:1.5px solid #EFE6E1;border-radius:1.25rem}
.nav{display:flex;align-items:center;gap:.75rem;width:100%;padding:.8rem 1rem;border-radius:.85rem;font-weight:700;color:#cdb9bd;text-align:left}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:#C9A24B;color:#3B0A17}
.chip{font-size:.7rem;font-weight:800;padding:.2rem .55rem;border-radius:999px;background:#F3E9D2;color:#6b4e12}
:focus-visible{outline:2px solid #C9A24B;outline-offset:2px}
</style>
</head>
<body class="h-screen overflow-hidden text-[15px] flex">

<div id="loginScreen" class="fixed inset-0 z-50 bg-deep flex items-center justify-center p-4">
  <div class="bg-cream p-10 rounded-3xl max-w-sm w-full text-center">
    <h1 class="font-display font-bold text-2xl text-deep mb-2">CANELLA<span class="text-gold">.</span></h1>
    <p class="text-muted font-semibold mb-8">Введите пароль, чтобы войти</p>
    <input type="password" id="adminPassword" placeholder="Пароль" class="f mb-4">
    <button onclick="checkPassword()" class="btn w-full">Войти</button>
    <p id="loginError" class="text-red-600 font-bold text-sm mt-3 hide">Неверный пароль</p>
  </div>
</div>

<aside id="sidebar" class="w-64 bg-deep flex flex-col hide shrink-0">
  <div class="h-20 flex items-center px-7"><h2 class="font-display font-bold text-xl text-white">CANELLA<span class="text-gold">.</span></h2></div>
  <nav class="flex-1 px-4 py-4 space-y-1.5">
    <button class="nav on" id="tab-catalog" onclick="switchTab('catalog')">Каталог вкусов</button>
    <button class="nav" id="tab-promos" onclick="switchTab('promos')">Промокоды</button>
    <button class="nav" id="tab-marketing" onclick="switchTab('marketing')">Доставка и акции</button>
  </nav>
  <div class="p-4"><button onclick="logout()" class="nav">Выйти</button></div>
</aside>

<main id="mainContent" class="flex-1 flex flex-col h-full overflow-hidden hide">
  <header class="h-20 px-8 flex items-center justify-between shrink-0">
    <div>
      <h1 id="pageTitle" class="font-display font-bold text-xl text-deep">Каталог вкусов</h1>
      <p class="text-muted font-semibold text-sm">Управление сайтом Canella VRN</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="saveIndicator" class="text-sm font-bold text-emerald-700 bg-emerald-100 px-3 py-1.5 rounded-lg opacity-0 transition-opacity">Сохранено в GitHub</span>
      <button id="saveBtn" onclick="saveAllData()" class="btn">Сохранить изменения</button>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto px-8 pb-16">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="stats"></div>

    <section id="view-catalog">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-semibold text-base">Макаронс</h3>
        <button onclick="openFlavorModal()" class="btn2">Добавить вкус</button>
      </div>
      <div id="flavorsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></div>
    </section>

    <section id="view-promos" class="hide">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-semibold text-base">Ваши промокоды</h3>
      </div>
      <div class="grid lg:grid-cols-5 gap-6 items-start">
        <div class="card p-6 lg:col-span-2 space-y-4 lg:sticky lg:top-0">
          <h4 class="font-display font-semibold">Новый промокод</h4>
          <div>
            <label class="lbl">Код</label>
            <div class="flex gap-2">
              <input id="p-code" class="f font-mono uppercase" placeholder="SPRING15" maxlength="20">
              <button type="button" onclick="randomCode()" class="btn2 shrink-0" title="Придумать код">Случайный</button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl">Тип скидки</label>
              <select id="p-type" class="f" onchange="updatePromoPreview()"><option value="percent">Процент, %</option><option value="fixed">Сумма, ₽</option></select></div>
            <div><label class="lbl">Размер</label><input id="p-value" type="number" min="1" value="10" class="f" oninput="updatePromoPreview()"></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl">Заказ от, ₽</label><input id="p-min" type="number" min="0" value="0" class="f"></div>
            <div><label class="lbl">Действует до</label><input id="p-exp" type="date" class="f"></div>
          </div>
          <label class="flex items-center gap-2 font-bold"><input type="checkbox" id="p-first" class="w-4 h-4 accent-[#3B0A17]"> Только на первый заказ</label>
          <div id="promoPreview" class="rounded-xl bg-deep text-white p-4 font-semibold"></div>
          <button onclick="addPromo()" class="btn w-full">Создать промокод</button>
          <p id="p-err" class="text-red-600 font-bold text-sm hide"></p>
        </div>
        <div class="lg:col-span-3 space-y-3" id="promoList"></div>
      </div>
    </section>

    <section id="view-marketing" class="hide space-y-6 max-w-3xl">
      <div class="card p-6">
        <h3 class="font-display font-semibold mb-4">Доставка</h3>
        <div class="grid grid-cols-2 gap-5">
          <div><label class="lbl">Бесплатная доставка от, ₽</label><input type="number" id="setting-freeDelivery" class="f"></div>
          <div><label class="lbl">Стоимость доставки, ₽</label><input type="number" id="setting-costDelivery" class="f"></div>
        </div>
      </div>
      <div class="card p-6 space-y-5">
        <h3 class="font-display font-semibold">Акции на сайте</h3>
        <div class="p-4 rounded-xl bg-cream space-y-2">
          <h4 class="font-bold">Левый блок</h4>
          <input id="setting-promo1Title" class="f" placeholder="Заголовок">
          <input id="setting-promo1Desc" class="f" placeholder="Описание">
        </div>
        <div class="p-4 rounded-xl bg-cream space-y-2">
          <h4 class="font-bold">Правый блок</h4>
          <input id="setting-promo2Title" class="f" placeholder="Заголовок">
          <input id="setting-promo2Desc" class="f" placeholder="Описание">
          <label class="lbl pt-1">Промокод в тексте</label>
          <input id="setting-promo2Badge" class="f font-mono" placeholder="CANELLA10">
        </div>
      </div>
    </section>
  </div>
</main>

<div id="flavorModal" class="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4 hide">
  <div class="bg-white w-full max-w-xl rounded-3xl overflow-hidden max-h-[92vh] flex flex-col">
    <div class="px-6 py-4 flex justify-between items-center border-b border-stone-100">
      <h3 class="font-display font-semibold" id="modalTitle">Редактировать вкус</h3>
      <button onclick="closeFlavorModal()" class="text-2xl leading-none text-muted hover:text-ink" aria-label="Закрыть">×</button>
    </div>
    <div class="p-6 space-y-4 overflow-y-auto">
      <input type="hidden" id="modal-id">
      <div class="flex gap-4 items-center">
        <div id="modal-preview" class="w-24 h-24 rounded-2xl shrink-0 overflow-hidden flex items-center justify-center bg-cream"></div>
        <div class="flex-1 space-y-2">
          <label class="lbl">Фото: имя файла или ссылка</label>
          <input id="modal-image" class="f" placeholder="macaroon1.png" oninput="previewModalImg()">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="lbl">Название</label><input id="modal-name" class="f"></div>
        <div><label class="lbl">Слово на фоне</label><input id="modal-watermark" class="f"></div>
      </div>
      <div><label class="lbl">Состав</label><textarea id="modal-desc" rows="2" class="f resize-none"></textarea></div>
      <div class="grid grid-cols-3 gap-4">
        <div><label class="lbl">Цена, ₽</label><input type="number" id="modal-price" class="f"></div>
        <div><label class="lbl">Бейдж</label><input id="modal-badge" class="f" placeholder="Хит"></div>
        <div><label class="lbl">Цвет</label>
          <div class="flex items-center gap-2"><input type="color" id="modal-color" class="w-11 h-11 rounded-lg cursor-pointer border-0 p-0"><span id="modal-color-hex" class="font-mono text-xs uppercase"></span></div></div>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-stone-100 flex justify-between items-center">
      <button onclick="deleteFlavor()" id="modal-btn-delete" class="text-red-600 font-bold hover:underline">Удалить</button>
      <div class="flex gap-2 ml-auto"><button onclick="closeFlavorModal()" class="btn2">Отмена</button><button onclick="saveFlavorModal()" class="btn">Сохранить</button></div>
    </div>
  </div>
</div>

<script>
// ВСТАВЬ СЮДА СВОЙ АДРЕС ИЗ CLOUDFLARE WORKERS
const API_BASE = "https://твой-воркер.workers.dev";
const LOCAL_ADMIN_PASSWORD = 'admin2026';
let authToken = localStorage.getItem('canella_worker_auth') || null;
// Пока вместо адреса стоит заглушка (пусто или кириллица), работаем локально без Worker
let localMode = !API_BASE || /[^\x00-\x7F]/.test(API_BASE);
const LOCAL_DATA_KEY = 'canella_admin_data';

const defaultData = {
 flavors: [
  {id:'f1',name:'Фисташка — малина',watermark:'Фисташка',badge:'Хит',desc:'Насыщенный ганаш из сицилийской фисташки и сочное малиновое конфи.',color:'#84A962',price:190,image:'macaroon1.png'},
  {id:'f2',name:'Дорблю — сладкая груша',watermark:'Дорблю',badge:'Гурме',desc:'Изысканный контраст благородного сыра дорблю и томлёной пряной груши.',color:'#D1BFA5',price:210,image:'macaroon2.png'},
  {id:'f3',name:'Кофе — бейлис',watermark:'Бейлис',badge:'Авторский',desc:'Сливочный капучино с добавлением оригинального ликёра Baileys.',color:'#B88A60',price:195,image:'macaroon3.png'},
  {id:'f4',name:'Шоколадный трюфель',watermark:'Трюфель',badge:'Классика',desc:'Глубокий бархатный вкус бельгийского тёмного шоколада Callebaut 70,5%.',color:'#4A2E26',price:190,image:'macaroon4.png'},
  {id:'f5',name:'Пармезан — инжир',watermark:'Пармезан',badge:'Гурме',desc:'Выдержанный 24 месяца пармезан в гармонии с вялёным инжиром.',color:'#D99F48',price:220,image:'macaroon5.png'}
 ],
 promos: [{code:'CANELLA10',type:'percent',value:10,min:0,exp:'',first:true,active:true}],
 settings: {freeDeliveryThreshold:5000,standardDeliveryCost:350,promo1Title:'Бесплатная доставка от 5 000 ₽',promo1Desc:'Привезём набор по Воронежу бесплатно',promo2Title:'Скидка 10% на первый заказ',promo2Desc:'Введите промокод в корзине',promo2Badge:'CANELLA10'}
};

let db = JSON.parse(JSON.stringify(defaultData));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function checkPassword() {
  const password = $('adminPassword').value;
  try {
    if (localMode) {
      if (password !== LOCAL_ADMIN_PASSWORD) return showLoginError();
      authToken = 'local-session';
      localStorage.setItem('canella_worker_auth', authToken);
      $('loginScreen').classList.add('hide');
      $('sidebar').classList.remove('hide');
      $('mainContent').classList.remove('hide');
      await loadDataFromWorker();
      return;
    }

    const res = await fetch(`${API_BASE}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: 'admin', password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.success || !data.token) return showLoginError();

    authToken = data.token;
    localStorage.setItem('canella_worker_auth', authToken);
    $('loginScreen').classList.add('hide');
    $('sidebar').classList.remove('hide');
    $('mainContent').classList.remove('hide');
    await loadDataFromWorker();
  } catch (e) {
    showLoginError('Нет связи с сервером. Проверьте API_BASE.');
  }
}

function showLoginError(msg) {
 const e = $('loginError');
 e.textContent = msg || 'Неверный пароль';
 e.classList.remove('hide');
 setTimeout(() => e.classList.add('hide'), 3000);
}

function logout() {
 authToken = null;
 localStorage.removeItem('canella_worker_auth');
 $('adminPassword').value = '';$('loginScreen').classList.remove('hide');
 $('sidebar').classList.add('hide');$('mainContent').classList.add('hide');
}
$('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });

// Автологин если токен есть
window.addEventListener('DOMContentLoaded', async () => {
 if (authToken) {
  $('loginScreen').classList.add('hide');
  $('sidebar').classList.remove('hide');$('mainContent').classList.remove('hide');
  await loadDataFromWorker();
 }
});

async function loadDataFromWorker() {
  if (localMode) {
    try {
      const saved = localStorage.getItem(LOCAL_DATA_KEY);
      db = saved ? { ...JSON.parse(saved), settings: { ...defaultData.settings, ...(JSON.parse(saved).settings || {}) } } : JSON.parse(JSON.stringify(defaultData));
    } catch (e) {
      db = JSON.parse(JSON.stringify(defaultData));
      console.warn('Не удалось прочитать локальные данные; загружены значения по умолчанию.', e);
    }
    init();
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/content`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    if (res.ok) {
      const incoming = await res.json();
      db = {
        ...defaultData,
        ...incoming,
        flavors: Array.isArray(incoming.flavors) ? incoming.flavors : defaultData.flavors,
        promos: Array.isArray(incoming.promos) ? incoming.promos : defaultData.promos,
        settings: { ...defaultData.settings, ...(incoming.settings || {}) }
      };
    } else if (res.status === 401) {
      logout();
      return;
    } else {
      alert('Не удалось загрузить данные из Worker. Проверьте его настройки.');
      db = JSON.parse(JSON.stringify(defaultData));
    }
  } catch (e) {
    alert('Не удалось подключиться к Worker. Проверьте URL и доступность сервиса.');
    db = JSON.parse(JSON.stringify(defaultData));
  }
  init();
}

const titles = {catalog:'Каталог вкусов',promos:'Промокоды',marketing:'Доставка и акции'};
function switchTab(t) {
 Object.keys(titles).forEach(k => {
  $('view-'+k).classList.toggle('hide', k !== t);$('tab-'+k).classList.toggle('on', k === t);
 });
 $('pageTitle').textContent = titles[t];
}

function init() {
 renderAll();
 const s = db.settings;
 $('setting-freeDelivery').value = s.freeDeliveryThreshold;
 $('setting-costDelivery').value = s.standardDeliveryCost;
 ['promo1Title','promo1Desc','promo2Title','promo2Desc','promo2Badge'].forEach(k => $('setting-'+k).value = s[k] || '');
 updatePromoPreview();
}

function renderAll() { renderStats(); renderFlavors(); renderPromos(); }

function renderStats() {
 const f = db.flavors, avg = f.length ? Math.round(f.reduce((a,x) => a + x.price, 0) / f.length) : 0;
 const act = db.promos.filter(p => p.active).length;
 const cards = [
  ['Вкусов в каталоге', f.length],
  ['Средняя цена', avg + ' ₽'],
  ['Активных промокодов', act],
  ['Бесплатная доставка от', (db.settings.freeDeliveryThreshold || 5000).toLocaleString('ru-RU') + ' ₽']
 ];
 $('stats').innerHTML = cards.map(c => `<div class="card p-5"><div class="text-muted font-bold text-sm mb-1">${c[0]}</div><div class="font-display font-semibold text-2xl text-deep">${c[1]}</div></div>`).join('');
}

function imgTag(f, cls) {
 return `<img src="${esc(f.image)}" alt="${esc(f.name)}" class="${cls}" onerror="this.outerHTML='<div class=&quot;w-20 h-20 rounded-full border-4 border-white shadow-md&quot; style=&quot;background:${esc(f.color)}&quot;></div>'">`;
}

function renderFlavors() {
 $('flavorsGrid').innerHTML = db.flavors.map(f => `
  <div class="card overflow-hidden hover:shadow-lg transition-shadow">
   <div class="h-44 relative flex items-center justify-center overflow-hidden" style="background:${esc(f.color)}26">
    <span class="absolute font-display font-bold text-5xl text-deep/10 select-none whitespace-nowrap">${esc(f.watermark)}</span>
    ${imgTag(f, 'relative z-10 h-36 w-36 object-contain drop-shadow-xl')}
    <span class="chip absolute top-3 right-3">${esc(f.badge)}</span>
   </div>
   <div class="p-5">
    <h4 class="font-display font-semibold text-sm mb-2 line-clamp-1">${esc(f.name)}</h4>
    <p class="text-sm text-muted font-semibold line-clamp-2 h-10 mb-4">${esc(f.desc)}</p>
    <div class="flex items-center justify-between">
     <span class="font-display font-bold text-lg text-deep">${f.price} ₽</span>
     <button onclick="openFlavorModal('${f.id}')" class="btn2 !py-1.5 text-sm">Изменить</button>
    </div>
   </div>
  </div>`).join('') || '<p class="text-muted font-semibold">Каталог пуст. Добавьте первый вкус.</p>';
}

// Промокоды
const rnd = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return 'CANELLA' + Array.from({length:3}, () => c[Math.floor(Math.random() * c.length)]).join(''); };
function randomCode() { $('p-code').value = rnd(); }
function promoText(p) { return (p.type === 'percent' ? `−${p.value}%` : `−${p.value} ₽`); }
function updatePromoPreview() {
 const v = Number($('p-value').value) || 0, t =$('p-type').value;
 $('promoPreview').innerHTML = `Покупатель сэкономит <b class="text-gold">${t==='percent'?v+'%':v+' ₽'}</b> с заказа из 3 000 ₽: итого <b>${t==='percent'?Math.round(3000*(1-v/100)):Math.max(0,3000-v)} ₽</b>`;
}

function addPromo() {
 const code = $('p-code').value.trim().toUpperCase().replace(/\s+/g,''), value = Number($('p-value').value), type =$('p-type').value;
 const err = m => { const e = $('p-err'); e.textContent = m; e.classList.remove('hide'); setTimeout(() => e.classList.add('hide'), 3500); };
 if (!code) return err('Введите код или нажмите «Случайный»');
 if (db.promos.some(p => p.code === code)) return err('Такой код уже есть');
 if (!(value > 0)) return err('Размер скидки должен быть больше нуля');
 if (type === 'percent' && value > 100) return err('Процент не может быть больше 100');
 db.promos.unshift({ code, type, value, min: Number($('p-min').value) || 0, exp:$('p-exp').value, first: $('p-first').checked, active: true });$('p-code').value = ''; $('p-exp').value = '';$('p-first').checked = false;
 renderAll();
}

function renderPromos() {
 $('promoList').innerHTML = db.promos.map((p, i) => {
  const expired = p.exp && new Date(p.exp + 'T23:59:59') < new Date();
  const st = expired ? 'Истёк' : p.active ? 'Активен' : 'Выключен';
  const stCls = expired ? 'bg-stone-200 text-stone-600' : p.active ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';
  const rules = [p.min ? `от ${p.min} ₽` : 'без минимума', p.first ? 'первый заказ' : 'любой заказ', p.exp ? `до ${p.exp.split('-').reverse().join('.')}` : 'бессрочно'].join(', ');
  return `<div class="card p-5 flex items-center gap-4 ${p.active && !expired ? '' : 'opacity-70'}">
   <div class="w-20 h-20 rounded-2xl bg-deep text-gold flex items-center justify-center font-display font-bold text-lg shrink-0">${promoText(p)}</div>
   <div class="flex-1 min-w-0">
    <div class="flex items-center gap-2 mb-1"><span class="font-mono font-bold text-lg truncate">${esc(p.code)}</span><span class="text-xs font-bold px-2 py-0.5 rounded-full ${stCls}">${st}</span></div>
    <div class="text-sm text-muted font-semibold">${rules}</div>
   </div>
   <div class="flex flex-col gap-1.5 items-end">
    <button onclick="togglePromo(${i})" class="btn2 !py-1 !px-3 text-sm">${p.active ? 'Выключить' : 'Включить'}</button>
    <button onclick="deletePromo(${i})" class="text-red-600 font-bold text-sm hover:underline">Удалить</button>
   </div></div>`;
 }).join('') || '<div class="card p-8 text-center text-muted font-semibold">Промокодов пока нет. Создайте первый в форме слева.</div>';
}

function togglePromo(i) { db.promos[i].active = !db.promos[i].active; renderAll(); }
function deletePromo(i) { if (confirm('Удалить промокод ' + db.promos[i].code + '?')) { db.promos.splice(i, 1); renderAll(); } }

// Редактирование вкусов
$('modal-color').addEventListener('input', e =>$('modal-color-hex').textContent = e.target.value);
function previewModalImg() {
 const f = { image: $('modal-image').value, name: '', color: $('modal-color').value };$('modal-preview').innerHTML = f.image ? imgTag(f, 'w-full h-full object-contain') : '';
}

function openFlavorModal(id = null) {
 const f = id ? db.flavors.find(x => x.id === id) : { id: '', name: '', watermark: '', desc: '', price: 200, badge: 'Новинка', color: '#EFA9BB', image: '' };
 $('modalTitle').textContent = id ? 'Редактировать вкус' : 'Новый вкус';
 $('modal-btn-delete').classList.toggle('hide', !id);$('modal-id').value = f.id;
 ['name','watermark','desc','price','badge','color','image'].forEach(k => $('modal-'+k).value = f[k]);$('modal-color-hex').textContent = f.color;
 previewModalImg();
 $('flavorModal').classList.remove('hide');
}

function closeFlavorModal() { $('flavorModal').classList.add('hide'); }

function saveFlavorModal() {
 if (!$('modal-name').value.trim()) {$('modal-name').focus(); return; }
 const id = $('modal-id').value;
 const d = {
  id: id || 'f' + Date.now(),
  name: $('modal-name').value.trim(),
  watermark: $('modal-watermark').value,
  desc: $('modal-desc').value,
  price: Number($('modal-price').value) || 0,
  badge: $('modal-badge').value,
  color: $('modal-color').value,
  image: $('modal-image').value.trim()
 };
 if (id) db.flavors[db.flavors.findIndex(x => x.id === id)] = d;
 else db.flavors.push(d);
 renderAll();
 closeFlavorModal();
}

function deleteFlavor() {
 if (confirm('Удалить этот вкус из каталога?')) {
  db.flavors = db.flavors.filter(x => x.id !== $('modal-id').value);
  renderAll();
  closeFlavorModal();
 }
}

// СОХРАНЕНИЕ В GITHUB ЧЕРЕЗ WORKER
async function saveAllData() {
  const s = db.settings;
  s.freeDeliveryThreshold = Math.max(0, Number($('setting-freeDelivery').value) || 0);
  s.standardDeliveryCost = Math.max(0, Number($('setting-costDelivery').value) || 0);
  ['promo1Title','promo1Desc','promo2Title','promo2Desc','promo2Badge'].forEach(k => s[k] = $('setting-'+k).value);

  const btn = $('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Сохранение...';

  try {
    if (localMode) {
      localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(db));
      renderStats();
      const indicator = $('saveIndicator');
      indicator.textContent = 'Сохранено на этом устройстве';
      indicator.classList.remove('opacity-0');
      setTimeout(() => indicator.classList.add('opacity-0'), 2500);
      return;
    }

    const res = await fetch(`${API_BASE}/api/content`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`
      },
      body: JSON.stringify(db)
    });

    if (res.ok) {
      const indicator = $('saveIndicator');
      indicator.textContent = 'Сохранено в GitHub';
      indicator.classList.remove('opacity-0');
      setTimeout(() => indicator.classList.add('opacity-0'), 2500);
      renderStats();
    } else if (res.status === 401) {
      logout();
      alert('Сессия истекла. Войдите снова.');
    } else {
      const details = await res.text().catch(() => '');
      alert('Ошибка сохранения (' + res.status + '). ' + details.slice(0, 250));
    }
  } catch (e) {
    alert(localMode ? 'Не удалось сохранить данные на этом устройстве.' : 'Сетевая ошибка при обращении к Worker.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Сохранить изменения';
  }
}

</script>
